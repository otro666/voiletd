; Вуаль на LilyGo T-Deck
;
; Сборка и заливка:  pio run -t upload
; Тесты без железа:  make test

[env:t-deck]
platform  = espressif32@6.9.0
; Берём общее описание ESP32-S3, а не «t-deck»: описание конкретной платы есть не во всех
; версиях PlatformIO, и сборка падала бы на первом шаге с невнятной ошибкой. Все нужные
; параметры задаём явно ниже — результат тот же.
board     = esp32-s3-devkitc-1
framework = arduino

board_build.mcu             = esp32s3
board_build.flash_mode      = qio
board_build.partitions      = huge_app.csv
board_upload.flash_size     = 16MB
board_build.arduino.memory_type = qio_opi     ; 8 МБ PSRAM в режиме OPI

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1               ; вывод в порт через USB, без отдельной микросхемы
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -Iinclude
    -std=gnu++17

    ; Настройки экрана здесь БОЛЬШЕ НЕТ: она переехала в include/display.h, в обычный
    ; код. Настройка флагами и была причиной падения — пропущенное значение не вызывает
    ; ни ошибки, ни предупреждения, и плата просто рушится внутри библиотеки.

lib_deps =
    jgromes/RadioLib@^7.1.0
    lovyan03/LovyanGFX@^1.1.16
    bodmer/TJpg_Decoder@^1.1.0                ; фотографии и стикеры блоками, без разворота целиком
    ; SD и WiFi входят в состав Arduino-ESP32, отдельно не нужны

monitor_speed = 115200
monitor_filters = esp32_exception_decoder     ; расшифровка адресов при падении

; Проверка переносимой логики без железа: формат кадра, разнесение, храповик, звук,
; транспорт, хранилище, ввод, знакомство. Крипто подменяется тестовой реализацией,
; обмен ключами при этом настоящий.
[env:native]
platform = native
build_flags = -Iinclude -std=c++17
; Проверка на компьютере: только переносимые файлы. audio_device.cpp, emoji.cpp и
; остальное железозависимое сюда не входит — там Arduino и драйверы.
build_src_filter = +<voile_frame.cpp> +<voile_diversity.cpp> +<voile_ratchet.cpp>
                   +<audio.cpp> +<transport.cpp> +<store.cpp> +<media.cpp>
                   +<input_logic.cpp> +<contacts.cpp>
